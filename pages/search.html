<script>
  function isInFreeMode() {
    const freeModeEnd = localStorage.getItem('freeModeEnd');
    if (!freeModeEnd) return false;
    return new Date().getTime() < parseInt(freeModeEnd);
  }

  function updateFreeModeStatus() {
    const status = document.getElementById('freeModeStatus');
    if (!status) return;
    const tickets = parseInt(localStorage.getItem('viewTickets') || '0');
    const freeModeEndRaw = parseInt(localStorage.getItem('freeModeEnd') || '0');
    const now = new Date().getTime();
    const remaining = Math.max(0, freeModeEndRaw - now);

    // If both time and tickets are zero -> show simple gray message without icons
    if (remaining <= 0 && tickets <= 0) {
      status.innerHTML = '問題アップロードで待ち時間ゼロ';
      status.className = 'free-mode-status ad';
      return;
    }

    // Otherwise show green background and: 「フリー」 時計アイコン 時間 チケットアイコン チケット数
    const iconColor = '#28a745';
    const clockHtml = `<i class="fa-solid fa-clock" style="margin:0 6px; color:${iconColor}"></i>`;
    const ticketHtml = `<i class="fa-solid fa-ticket" style="margin-left:8px; color:${iconColor}"></i> ${tickets}`;

    // Show remaining time if we have free-mode time, otherwise show 0時間
    let timeText = '0時間';
    if (remaining > 0) {
      const hours = Math.floor(remaining / (60 * 60 * 1000));
      const minutes = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
      const seconds = Math.floor((remaining % (60 * 1000)) / 1000);
      timeText = `${hours}時間${minutes}分${seconds}秒`;
    }

  status.innerHTML = `フリー ${clockHtml} <span style="margin-left:1px;">${timeText}</span> <span style="margin-left:8px;">${ticketHtml}</span>`;
    status.className = 'free-mode-status free';
  }

  // 広告ポップアップ表示（通常モード）
function showAdPopup(fileUrl) {
  const overlay = document.createElement('div');
  overlay.className = 'popup-overlay';
  overlay.innerHTML = `
    <div class="popup-content">
      <button class="popup-close">&times;</button>
      <h2>カウントダウン後に開けます</h2>
      <div class="countdown-text" id="countdownText">150</div>
      <p id="statusText">問題アップロードで待ち時間ゼロ！</p>
      <div class="ad-video">
        <video controls autoplay style="width: 100%; border-radius: 1rem; background: #000;">
          <source src="../assets/考査村ビデオ.mp4" type="video/mp4">
          お使いのブラウザは動画再生に対応していません。
        </video>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  let countdown = 150;
  const countdownEl = overlay.querySelector('#countdownText');
  const statusEl    = overlay.querySelector('#statusText');
  const timer = setInterval(() => {
    countdown--;
    countdownEl.textContent = countdown;
    if (countdown <= 0) {
      clearInterval(timer);
      statusEl.textContent = '';  // ステータスは消す

      // ↓ダウンロードボタン風にデザインを変更↓
      countdownEl.textContent = 'ファイル表示';
      countdownEl.style.cursor = 'pointer';
      // 背景薄い青
      countdownEl.style.backgroundColor = '#e0f5ff';
      // 枠は濃い青
      countdownEl.style.border = '1px solid #0071e3';
      // 文字色は濃い青
      countdownEl.style.color = '#005bb5';
      // 少し丸角
      countdownEl.style.borderRadius = '6px';
      countdownEl.style.padding = '0.4rem 0.8rem';

      countdownEl.onclick = () => {
        window.open(fileUrl, '_blank', 'noopener,noreferrer');
        document.body.removeChild(overlay);
      };
    }
  }, 1000);


  overlay.querySelector('.popup-close').onclick = () => {
    clearInterval(timer);
    document.body.removeChild(overlay);
  };
  overlay.onclick = e => {
    if (e.target === overlay) {
      clearInterval(timer);
      document.body.removeChild(overlay);
    }
  };
}

  // 管理者パスワード入力モーダル表示
    // action: 'edit' or 'delete'（将来的に拡張）
    async function showAdminPasswordPrompt(itemId, action = 'edit') {
    // Overlay for password input
    const overlay = document.createElement('div');
    overlay.className = 'popup-overlay';
    overlay.style = 'position:fixed;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;z-index:3000;background:rgba(0,0,0,0.5);';
    overlay.innerHTML = `
      <div style="background:#fff;padding:1.2rem;border-radius:10px;max-width:480px;width:94%;box-shadow:0 6px 30px rgba(0,0,0,0.25);">
        <h3 style="margin:0 0 0.6rem 0;font-size:1.05rem;">${action === 'delete' ? '削除用パスワードの入力' : '編集用パスワードの入力'}</h3>
        <p style="margin:0 0 0.8rem 0;color:#555;font-size:0.95rem;">${action === 'delete' ? 'このアイテムを削除するための管理者パスワードを入力してください。' : 'このアイテムを編集するための管理者パスワードを入力してください。'}</p>
        <input id="adminPassInput" type="password" placeholder="パスワード" style="width:100%;padding:0.5rem;margin-bottom:0.6rem;font-size:1rem;" />
        <div style="display:flex;gap:0.6rem;justify-content:flex-end;">
          <button id="adminPassCancel" style="padding:0.5rem 0.8rem;border-radius:6px;border:1px solid #ccc;background:#fff;">キャンセル</button>
          <button id="adminPassOk" style="padding:0.5rem 0.8rem;border-radius:6px;border:0;background:#0071e3;color:#fff;">OK</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    // フォーカスとキーボード操作（EnterでOK、Escで閉じる）
    setTimeout(() => {
      const pwInputEl = overlay.querySelector('#adminPassInput');
      if (pwInputEl) pwInputEl.focus();
      pwInputEl && pwInputEl.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') overlay.querySelector('#adminPassOk').click();
        if (ev.key === 'Escape') cleanup();
      });
    }, 20);

    const cleanup = () => { try { overlay.remove(); } catch (e){} };

    overlay.querySelector('#adminPassCancel').addEventListener('click', () => { cleanup(); });
    overlay.addEventListener('click', (ev) => { if (ev.target === overlay) cleanup(); });

    overlay.querySelector('#adminPassOk').addEventListener('click', async () => {
      const pw = overlay.querySelector('#adminPassInput').value || '';
      try {
        // find the row for this item
        const btn = document.querySelector(`button.btn-edit[data-id="${itemId}"], button.btn-delete[data-id="${itemId}"]`);
        const tr = btn ? btn.closest('tr') : null;
        const storedPw = tr ? (tr.dataset.adminPassword || '') : '';
        // compare with per-row password (plain-text)
        if (storedPw !== pw) {
          alert('パスワードが間違っています。');
          return;
        }

        // 認証成功
        cleanup();

        if (action === 'delete') {
          // confirm deletion
          if (!confirm('本当にこの投稿を削除しますか？')) return;
          try {
            await kosamuraAPI.deletePost(Number(itemId));
            if (tr) tr.remove();
            alert('削除しました');
          } catch (err) {
            console.error('deletePost error', err);
            alert('削除に失敗しました');
          }
          return;
        }

        // action === 'edit' -> open an edit modal with multiple fields
        if (action === 'edit') {
          // Prepare edit overlay
          const editOverlay = document.createElement('div');
          editOverlay.className = 'popup-overlay';
          editOverlay.style = 'position:fixed;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;z-index:3100;background:rgba(0,0,0,0.45);';
          const currentComment = (tr && tr.querySelector('.comment-cell')) ? (tr.querySelector('.comment-cell').dataset.comment || tr.querySelector('.comment-cell').innerText) : '';
          const curGrade = tr ? (tr.querySelector('.grade-cell') ? tr.querySelector('.grade-cell').textContent : '') : '';
          const curYear = tr ? (tr.querySelector('.year-cell') ? tr.querySelector('.year-cell').textContent : '') : '';
          const curType = tr ? (tr.querySelector('.type-cell') ? tr.querySelector('.type-cell').textContent : '') : '';
          const curSubject = tr ? (tr.querySelector('.subject-cell') ? tr.querySelector('.subject-cell').textContent : '') : '';
          const curContent = tr ? (tr.querySelector('.content-cell') ? tr.querySelector('.content-cell').textContent : '') : '';
          const curLikes = tr ? (tr.querySelector('.btn-like') ? parseInt(tr.querySelector('.btn-like').textContent||'0',10) : 0) : 0;
          const curBad = tr ? (tr.querySelector('.btn-bad') ? parseInt(tr.querySelector('.btn-bad').textContent||'0',10) : 0) : 0;
          editOverlay.innerHTML = `
            <div style="background:#fff;padding:1rem;border-radius:10px;max-width:760px;width:96%;box-shadow:0 6px 30px rgba(0,0,0,0.25);">
              <h3 style="margin:0 0 0.6rem 0;font-size:1.05rem;">投稿を編集</h3>
              <div style="display:flex;flex-direction:column;gap:0.6rem;margin-bottom:0.6rem;">
                <label style="font-weight:600;">学年</label>
                <select id="editGrade" style="padding:0.5rem;">
                  <option value="">(選択)</option>
                  <option>高1</option><option>高2</option><option>高3</option>
                </select>

                <label style="font-weight:600;">年度</label>
                <select id="editYear" style="padding:0.5rem;">
                  <option value="">(選択)</option>
                  <option>2020（R2）</option><option>2021（R3）</option><option>2022（R4）</option><option>2023（R5）</option><option>2024（R6）</option><option>2025（R7）</option><option>不明</option>
                </select>

                <label style="font-weight:600;">種類</label>
                <select id="editType" style="padding:0.5rem;">
                  <option value="">(選択)</option>
                  <option>前期中間</option><option>前期期末</option><option>後期中間</option><option>後期期末</option><option>考査以外</option>
                </select>

                <label style="font-weight:600;">科目</label>
                <select id="editSubject" style="padding:0.5rem;">
                  <option value="">(選択)</option>
                  <option>現国・論国</option><option>言文・古探</option><option>数学Ⅰ・Ⅱ・Ⅲ</option><option>数学Ａ・Ｂ・Ｃ</option><option>英語コミュ</option><option>論理表現</option><option>化学・化学基礎</option><option>生物・生物基礎</option><option>物理・物理基礎</option><option>地学・地学基礎</option><option>歴史総合</option><option>地理</option><option>日本史</option><option>世界史</option><option>公共</option><option>情報</option><option>保健体育</option><option>家庭科</option><option>国語</option><option>数学</option><option>理科</option><option>英語</option><option>地歴</option><option>その他</option>
                </select>

                <label style="font-weight:600;">内容</label>
                <select id="editContent" style="padding:0.5rem;">
                  <option value="">(選択)</option>
                  <option>セット</option><option>問題</option><option>解答</option><option>解説</option>
                </select>
              </div>
              <label style="font-weight:600;">コメント</label>
              <textarea id="editComment" style="width:100%;height:120px;padding:0.6rem;margin-bottom:0.6rem;font-size:1rem;">${String(currentComment).replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea>
              <div style="display:flex;gap:0.6rem;align-items:center;justify-content:flex-end;">
                <label style="display:flex;align-items:center;gap:0.4rem;margin-right:auto;">
                  <input type="checkbox" id="editResetEval"> 評価をリセット
                </label>
                <button id="editCancel" style="padding:0.5rem 0.8rem;border-radius:6px;border:1px solid #ccc;background:#fff;">キャンセル</button>
                <button id="editSave" style="padding:0.5rem 0.8rem;border-radius:6px;border:0;background:#0071e3;color:#fff;">更新</button>
              </div>
            </div>
          `;
          document.body.appendChild(editOverlay);

          const removeEditOverlay = () => { try { window._hasUnsavedSearchEdit = false; editOverlay.remove(); } catch(e){} };
          // Do NOT close the edit form when clicking outside (user requested).
          // Bind cancel button to remove overlay and clear unsaved flag.
          editOverlay.querySelector('#editCancel').addEventListener('click', removeEditOverlay);

          // Ensure a single global beforeunload handler is installed to warn on reload when there are unsaved edits
          if (!window._beforeUnloadHandlerInstalled) {
            window._beforeUnloadHandlerInstalled = true;
            window._hasUnsavedSearchEdit = false;
            window.addEventListener('beforeunload', function(e) {
              if (window._hasUnsavedSearchEdit) {
                // 標準のメッセージはブラウザにより無視される場合がありますが、戻り値を設定して警告を促します
                e.preventDefault();
                e.returnValue = '未保存の変更があります。ページを離れますか？';
                return e.returnValue;
              }
            });
          }

          // Track unsaved changes inside this edit form. Do not close on outside click.
          window._hasUnsavedSearchEdit = false;
          const markUnsaved = () => { window._hasUnsavedSearchEdit = true; };
          ['#editGrade','#editYear','#editType','#editSubject','#editContent','#editComment','#editResetEval'].forEach(sel => {
            try {
              const el = editOverlay.querySelector(sel);
              if (!el) return;
              const evName = (el.tagName && el.tagName.toLowerCase() === 'textarea') ? 'input' : 'change';
              el.addEventListener(evName, markUnsaved);
            } catch(e) {}
          });

          // 初期値を select に設定し、キーボード操作を追加（Enterで保存、Escで閉じる）
          setTimeout(() => {
            try {
              const sGrade = editOverlay.querySelector('#editGrade'); if (sGrade) sGrade.value = curGrade || '';
              const sYear = editOverlay.querySelector('#editYear'); if (sYear) sYear.value = curYear || '';
              const sType = editOverlay.querySelector('#editType'); if (sType) sType.value = curType || '';
              const sSubject = editOverlay.querySelector('#editSubject'); if (sSubject) sSubject.value = curSubject || '';
              const sContent = editOverlay.querySelector('#editContent'); if (sContent) sContent.value = curContent || '';
              const commentEl = editOverlay.querySelector('#editComment'); if (commentEl) commentEl.focus();
            } catch(e){/* ignore */}
            // キーボード操作：Enterで確定（ただしコメントの textarea 内は除外）、Escで閉じる
            editOverlay.addEventListener('keydown', (ev) => {
              if (ev.key === 'Escape') removeEditOverlay();
              if (ev.key === 'Enter' && document.activeElement && document.activeElement.tagName !== 'TEXTAREA') {
                ev.preventDefault();
                editOverlay.querySelector('#editSave').click();
              }
            }, true);
          }, 20);

          // Save updates
          editOverlay.querySelector('#editSave').addEventListener('click', async () => {
            const newGrade = editOverlay.querySelector('#editGrade').value || '';
            const newYear = editOverlay.querySelector('#editYear').value || '';
            const newType = editOverlay.querySelector('#editType').value || '';
            const newSubject = editOverlay.querySelector('#editSubject').value || '';
            const newContent = editOverlay.querySelector('#editContent').value || '';
            const newComment = editOverlay.querySelector('#editComment').value || '';
            const resetEvalChecked = !!editOverlay.querySelector('#editResetEval').checked;
            const likeBtn = tr ? tr.querySelector('.btn-like') : null;
            const badBtn = tr ? tr.querySelector('.btn-bad') : null;
            let likes = likeBtn ? parseInt(likeBtn.textContent||'0',10) : 0;
            let bad = badBtn ? parseInt(badBtn.textContent||'0',10) : 0;
            if (resetEvalChecked) { likes = 0; bad = 0; }
            try {
              const postData = {
                id: Number(itemId),
                grade: newGrade,
                year: newYear,
                type: newType,
                subject: newSubject,
                stream: tr ? tr.dataset.stream : '',
                contentType: newContent,
                format: tr ? (tr.querySelector('.format-cell') ? tr.querySelector('.format-cell').textContent : '') : '',
                comment: newComment,
                url: tr ? (tr.querySelector('.link-cell a') ? tr.querySelector('.link-cell a').dataset.url : '') : '',
                likes: likes,
                bad: bad,
                adminPassword: tr ? tr.dataset.adminPassword : ''
              };
              await kosamuraAPI.updatePost(postData);
              // update DOM
              if (tr) {
                if (tr.querySelector('.grade-cell')) tr.querySelector('.grade-cell').textContent = newGrade;
                if (tr.querySelector('.year-cell')) tr.querySelector('.year-cell').textContent = newYear;
                if (tr.querySelector('.type-cell')) tr.querySelector('.type-cell').textContent = newType;
                if (tr.querySelector('.subject-cell')) tr.querySelector('.subject-cell').textContent = newSubject;
                if (tr.querySelector('.content-cell')) tr.querySelector('.content-cell').textContent = newContent;
                // update likes/bad if they were reset or changed
                const likeBtn = tr.querySelector('.btn-like');
                const badBtn = tr.querySelector('.btn-bad');
                if (likeBtn) { likeBtn.textContent = String(likes); if (likes === 0) likeBtn.classList.remove('active'); }
                if (badBtn) { badBtn.textContent = String(bad); if (bad === 0) badBtn.classList.remove('active'); }
                const td = tr.querySelector('.comment-cell');
                if (td) {
                  td.dataset.comment = String(newComment).replace(/</g,'&lt;').replace(/>/g,'&gt;');
                  const box = td.querySelector('.comment-text');
                  if (box) box.innerHTML = td.dataset.comment;
                }
              }
              alert('更新しました');
              removeEditOverlay();
            } catch (err) {
              console.error('updatePost error', err);
              alert('更新に失敗しました');
            }
          });
        }
      } catch (err) {
        console.error('checkAdminPassword error', err);
        alert('認証に失敗しました。');
      }
    });
  }

  // テーブル全体のクリックイベントハンドラー
  function handleTableClick(e) {
    const target = e.target;
    
    // 「見る」リンクの処理
    if (target.classList.contains('view-link')) {
      e.preventDefault();
      const fileUrl = target.dataset.url;
      if (isInFreeMode()) {
        // フリーモードなら直接開く
        window.open(fileUrl, '_blank', 'noopener,noreferrer');
      } else {
        // 通常モード：チケットがあれば消費して広告無しで開く、無ければ広告ポップアップ
        const tickets = parseInt(localStorage.getItem('viewTickets') || '0');
        if (tickets > 0) {
          // consume one ticket and open
          localStorage.setItem('viewTickets', String(Math.max(0, tickets - 1)));
          // update header display if present
          try { if (typeof updateFreeModeStatus === 'function') updateFreeModeStatus(); } catch(e){}
          window.open(fileUrl, '_blank', 'noopener,noreferrer');
        } else {
          // show ad popup if no tickets
          showAdPopup(fileUrl);
        }
      }
      return;
    }

    // 編集 / 削除アイコンの処理（アイコン内の<i>などがクリックされても対応）
    const btn = target.closest && target.closest('button');
    if (btn) {
      if (btn.classList.contains('btn-edit')) {
        e.preventDefault();
        const id = btn.dataset.id;
        showAdminPasswordPrompt(id, 'edit');
        return;
      }
      if (btn.classList.contains('btn-delete')) {
        e.preventDefault();
        const id = btn.dataset.id;
        showAdminPasswordPrompt(id, 'delete');
        return;
      }
    }
    
    // いいねボタンの処理
    if (target.classList.contains('btn-like')) {
      const id = target.dataset.id, prev = localStorage.getItem('vote_' + id), tr = target.closest('tr');
      const badBtn = tr.querySelector('.btn-bad');
      let count = parseInt(target.textContent.replace(/\D/g,''),10);
      
      if (prev==='good') {
        target.classList.remove('active'); localStorage.removeItem('vote_' + id); kosamuraAPI.unlike(Number(id));
        target.textContent = `${--count}`;
      } else {
        if (prev==='bad') {
          let bc = parseInt(badBtn.textContent.replace(/\D/g,''),10);
          badBtn.classList.remove('active'); localStorage.removeItem('vote_' + id); kosamuraAPI.unbad(Number(id));
          badBtn.textContent = `${--bc}`;
        }
        target.classList.add('active'); localStorage.setItem('vote_' + id, 'good'); kosamuraAPI.like(Number(id));
        target.textContent = `${++count}`;
      }
      return;
    }
    
    // バッドボタンの処理
    if (target.classList.contains('btn-bad')) {
      const id = target.dataset.id, prev = localStorage.getItem('vote_' + id), tr = target.closest('tr');
      const likeBtn = tr.querySelector('.btn-like');
      let count = parseInt(target.textContent.replace(/\D/g,''),10);
      if (prev==='bad') {
        target.classList.remove('active'); localStorage.removeItem('vote_' + id); kosamuraAPI.unbad(Number(id));
        target.textContent = `${--count}`;
      } else {
        if (prev==='good') {
          let lc = parseInt(likeBtn.textContent.replace(/\D/g,''),10);
          likeBtn.classList.remove('active'); localStorage.removeItem('vote_' + id); kosamuraAPI.unlike(Number(id));
          likeBtn.textContent = `${--lc}`;
        }
        target.classList.add('active'); localStorage.setItem('vote_' + id, 'bad'); kosamuraAPI.bad(Number(id));
        target.textContent = `${++count}`;
      }
      return;
    }
  }
  
  // 後方互換性のため残す
  function attachHandlers() {
    attachHandlersOptimized();
  }

  // 相対時間表示関数
  function formatRelativeTime(dateStr) {
    try {
      const date = new Date(dateStr);
      const now = new Date();
      const diffMs = now.getTime() - date.getTime();
      const diffSec = Math.floor(diffMs / 1000);
      const diffMin = Math.floor(diffSec / 60);
      const diffHour = Math.floor(diffMin / 60);
      const diffDay = Math.floor(diffHour / 24);

      if (diffDay >= 1) {
        return `${diffDay}日前`;
      } else if (diffHour >= 1) {
        return `${diffHour}時間前`;
      } else if (diffMin >= 1) {
        return `${diffMin}分前`;
      } else {
        return `${diffSec}秒前`;
      }
    } catch (error) {
      return dateStr;
    }
  }

  // データ取得（パフォーマンス改善版）
  async function fetchData() {
    const tbody = document.getElementById('resultBody');
  tbody.innerHTML = '<tr id="loadingRow"><td colspan="12" style="text-align:center;color:#666"><div class="loading-placeholder"><div class="loading-spinner"></div><p>読み込み中…（表は横スクロール対応）</p></div></td></tr>';
    
    // タイムアウト設定（30秒）
    const timeoutPromise = new Promise((_, reject) => {
      setTimeout(() => reject(new Error('タイムアウト: データの取得に時間がかかりすぎています')), 30000);
    });
    
    try {
      const dataPromise = kosamuraAPI.getData();
      const data = await Promise.race([dataPromise, timeoutPromise]);
      buildRows(data);
    } catch (error) {
      console.error('データ取得エラー:', error);
      if (error.message.includes('タイムアウト')) {
  tbody.innerHTML = '<tr><td colspan="12" style="text-align:center;color:orange;"><div style="margin: 20px 0;"><p>データの取得に時間がかかっています</p><button onclick="retryFetch()" style="padding: 8px 16px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer;">再試行</button></div></td></tr>';
      } else {
  tbody.innerHTML = '<tr><td colspan="12" style="text-align:center;color:red;">データの取得に失敗しました: ' + error.message + '</td></tr>';
      }
    }
  }

  // 再試行機能
  function retryFetch() {
    fetchData();
  }

  // キャッシュクリア機能
  async function clearCacheAndFetch() {
    try {
      // キャッシュクリアAPIを呼び出し
      await fetch(`${window.location.origin}/exec?function=clearCache`);
      console.log('キャッシュをクリアしました');
      
      // データを再取得
      fetchData();
    } catch (error) {
      console.error('キャッシュクリアエラー:', error);
      // 失敗しても再取得
      fetchData();
    }
  }

  // 結果描画（パフォーマンス改善版）
  function buildRows(data) {
    const tbody = document.getElementById('resultBody');
    tbody.innerHTML = '';
    if (!data || data.length === 0) {
  tbody.innerHTML = '<tr><td colspan="12" style="text-align:center;color:#666">データがありません</td></tr>';
      return;
    }
    
    // DocumentFragmentを使用してDOM操作を最適化
    const fragment = document.createDocumentFragment();
    
    data.forEach(item => {
      const vt = localStorage.getItem('vote_' + item.id);
      const tr = document.createElement('tr');
      // store useful dataset values per-row (including admin password and id)
      tr.dataset.id = String(item.id || '');
      ['grade','year','type','subject','stream'].forEach(k => {
        tr.dataset[k] = String(item[k] || '');
      });
      tr.dataset.adminPassword = String(item.adminPassword || '');
      tr.dataset.date = String(item.date || '');
      const safe = String(item.comment || '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const rel = formatRelativeTime(item.date);
      tr.innerHTML = `
        <td class="grade-cell">${String(item.grade || '')}</td>
        <td class="year-cell">${String(item.year || '')}</td>
        <td class="type-cell">${String(item.type || '')}</td>
        <td class="subject-cell">${String(item.subject || '')}</td>
        <td class="stream-cell">${String(item.stream || '')}</td>
        <td class="content-cell">${String(item.contentType || '')}</td>
        <td class="format-cell">${String(item.format || '')}</td>
        <td class="comment-cell" data-comment="${safe}"><div class="comment-text">${safe}</div></td>
  <td class="link-cell"><a href="#" class="view-link" data-url="${String(item.url || '')}">見る</a></td>
  <td class="col-date date-cell">${rel}</td>
        <td class="col-eval eval-cell">
          <button class="btn-like${vt==='good'?' active':''}" data-id="${item.id}">${item.likes || 0}</button>
          <button class="btn-bad${vt==='bad'?' active':''}" data-id="${item.id}">${item.bad || 0}</button>
        </td>`;
      // 追加: 編集 / 削除アイコンを1つのアクションセルにまとめて右端に配置（アイコンを密着させる）
      const actionTd = document.createElement('td');
      actionTd.className = 'action-cell';
      actionTd.innerHTML = `
        <button class="btn-edit icon-btn" data-id="${item.id}" title="編集" aria-label="編集"><i class="fa-solid fa-pen-to-square"></i></button>
        <button class="btn-delete icon-btn" data-id="${item.id}" title="削除" aria-label="削除"><i class="fa-solid fa-trash"></i></button>
      `;
      tr.appendChild(actionTd);
      fragment.appendChild(tr);
    });
    
    // 一括でDOMに追加
    tbody.appendChild(fragment);
    
    // イベントリスナーを一括設定（委譲を使用）
    attachHandlersOptimized();
    
    // フィルタ、ソート、カラム表示を適用
    requestAnimationFrame(() => {
      applyFilters();
      applySort();
      applyColumns();
    });
  }

  // フィルタ適用
  function applyFilters() {
    let visibleCount = 0;
    document.querySelectorAll('#resultBody tr').forEach(tr => {
      if (!tr.dataset) return;
      const ok = ['grade','year','type','subject','stream']
        .every(k => !filter[k] || tr.dataset[k] === filter[k]);
      tr.style.display = ok ? '' : 'none';
      if (ok) visibleCount++;
    });
    
    // フィルターが適用されているかチェック
    const hasActiveFilters = Object.values(filter).some(value => value !== '');
    
    // フィルターが適用されていて、表示される行がない場合
    if (hasActiveFilters && visibleCount === 0) {
      const tbody = document.getElementById('resultBody');
      const noResultsRow = document.createElement('tr');
  noResultsRow.innerHTML = '<td colspan="12" style="text-align:center;color:#666">一致するものはありませんでした。</td>';
      noResultsRow.id = 'noResultsRow';
      tbody.appendChild(noResultsRow);
    } else {
      // 結果がある場合は「一致するものはありませんでした。」の行を削除
      const noResultsRow = document.getElementById('noResultsRow');
      if (noResultsRow) {
        noResultsRow.remove();
      }
    }
  }

  // ソート適用
  function applySort() {
    const mode = document.getElementById('sortMenu').value;
    const tb = document.getElementById('resultBody');
    const rows = Array.from(tb.children).filter(r => r.style.display!=='none' && r.dataset.date);

    rows.sort((a,b) => {
      if (mode === 'upload_desc') {
        return new Date(b.dataset.date) - new Date(a.dataset.date);
      }
      if (mode === 'upload_asc') {
        return new Date(a.dataset.date) - new Date(b.dataset.date);
      }
      if (mode === 'year_desc') {
        return parseInt(b.children[1].textContent) - parseInt(a.children[1].textContent);
      }
      if (mode === 'year_asc') {
        return parseInt(a.children[1].textContent) - parseInt(b.children[1].textContent);
      }
      return 0;
    });
    rows.forEach(r => tb.appendChild(r));
  }

  // カラム表示制御（パフォーマンス改善版）
  function applyColumns() {
    // 基本的なカラム表示制御
    const toggleDate = document.getElementById('toggleDate').checked;
    const toggleFormatCol = document.getElementById('toggleFormatCol').checked;
    const toggleEval = document.getElementById('toggleEval').checked;
    const commentMode = document.getElementById('commentMode').value;
    
    // 一括でクラスを適用
    document.querySelectorAll('.col-date').forEach(c => c.classList.toggle('hidden-col', !toggleDate));
    document.querySelectorAll('.format-cell').forEach(c => c.classList.toggle('hidden-col', !toggleFormatCol));
    document.querySelectorAll('th.col-format').forEach(th => th.classList.toggle('hidden-col', !toggleFormatCol));
    document.querySelectorAll('.col-eval').forEach(c => c.classList.toggle('hidden-col', !toggleEval));
    document.querySelectorAll('th.col-comment, td.comment-cell').forEach(el => el.classList.toggle('hidden-col', commentMode==='none'));
    
    // コメント表示制御（必要な場合のみ実行）
    if (commentMode !== 'none') {
      document.querySelectorAll('.comment-cell .comment-text').forEach(box => {
        const td = box.parentElement;
        // 既存のリンクを削除
        td.querySelectorAll('a.extra-link').forEach(a => a.remove());
        
        // スタイルを設定
        box.style.overflow = 'hidden';
        box.style.display = '-webkit-box';
        box.style.webkitBoxOrient = 'vertical';
        
        if (commentMode === 'compact') {
          // compact モード: 通常は1行表示だが、もともと1行のテキストの場合は
          // 切れてしまわないように改行可 (折り返し) にして全文表示する。
          const rawText = td.dataset.comment || '';
          if (rawText.split('\n').length === 1) {
            // 単一行のコメント -> 折り返しで全文表示
            box.style.webkitLineClamp = 'none';
            box.style.maxHeight = 'none';
            box.style.overflow = 'visible';
            box.style.display = 'block';
          } else {
            // 複数行を想定 -> 1行に切る
            box.style.webkitLineClamp = '1';
            box.style.maxHeight = '1.4em';
            box.style.overflow = 'hidden';
            box.style.display = '-webkit-box';
          }
        } else if (commentMode === 'lines3') {
          box.style.webkitLineClamp = '3';
          box.style.maxHeight = 'calc(3 * 1.4em)';
        } else {
          box.style.webkitLineClamp = 'none';
          box.style.maxHeight = 'none';
          box.style.overflow = 'visible';
          box.style.display = 'block';
        }
        
        // 必要に応じて「もっと読む」リンクを追加
        const raw = td.dataset.comment || '';
        const lines = raw.split('\n').length;
        const chars = raw.length;
        const shouldTruncate = (commentMode==='lines3' && lines>3) || (commentMode==='compact' && (lines>1||chars>100));
        
        if (shouldTruncate && raw.trim()) {
          const more = document.createElement('a');
          more.href = '#'; 
          more.textContent = '...もっと読む'; 
          more.className = 'extra-link';
          more.onclick = e => {
            e.preventDefault();
            box.style.webkitLineClamp = 'none';
            box.style.maxHeight = 'none';
            box.style.overflow = 'visible';
            box.style.display = 'block';
            more.remove();
            const less = document.createElement('a');
            less.href = '#'; 
            less.textContent = '折りたたむ'; 
            less.className = 'extra-link';
            less.onclick = ev => { 
              ev.preventDefault(); 
              applyColumns(); 
            };
            td.appendChild(less);
          };
          td.appendChild(more);
        }
      });
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    updateFreeModeStatus();
    setInterval(updateFreeModeStatus, 1000);
    ['grade','year','type','subject','stream'].forEach(id => {
      document.getElementById(id).onchange = e => { filter[id] = e.target.value; applyFilters(); };
    });
    document.getElementById('btnClearFilters').onclick = () => {
      ['grade','year','type','subject','stream'].forEach(k => {
        const el = document.getElementById(k);
        el.value = ''; filter[k] = '';
      });
      applyFilters();
    };
    document.getElementById('btnRefresh').onclick = clearCacheAndFetch;
    document.getElementById('toggleDate').onchange = applyColumns;
    document.getElementById('toggleFormatCol').onchange = applyColumns;
    document.getElementById('toggleEval').onchange = applyColumns;
    document.getElementById('commentMode').onchange = applyColumns;
    document.getElementById('sortMenu').onchange = applySort;
     applyColumns();
     fetchData();

    // 横スクロール誘導（数秒）
    const overlay = document.getElementById('scroll-hint-overlay');
    const arrow = document.getElementById('scroll-arrow');
    let dir = 1, count = 0;
    const anim = setInterval(() => {
      arrow.style.transform = `translateX(${dir*32}px)`;
      dir *= -1;
      count++;
      if(count > 5) {
        clearInterval(anim);
        overlay.style.opacity = 0;
        setTimeout(()=>{ overlay.style.display = 'none'; }, 600);
      }
    }, 400);
  });
</script>
