<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>開発情報</title>
  <style>
    body {
      background-color: #f0f8ff; /* ごく淡い青 */
      font-family: sans-serif;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #003366;
      font-size: 1.4em;
      border-bottom: 1px solid #003366;
      margin-bottom: 15px;
    }

    .faq {
      margin-bottom: 20px;
      padding: 10px;
      border-left: 4px solid #003366;
      background: #ffffff;
      border-radius: 4px;
    }

    .question {
      font-weight: bold;
      margin-bottom: 5px;
      color: #003366;
    }

    .answer {
      margin-left: 10px;
    }
  </style>
</head>
<body>

<div>
  <h1>よくある問い合わせ</h1>

  <div class="faq">
    <div class="question">Q. 投稿ができない・問題が開けない</div>
    <div class="answer">
      A. LINEやInstagramの中で開いてしまうと正しく動作しません。通常のブラウザで開いてください。<br>
      動作確認済みブラウザ: Safari / Edge / Chrome / Brave / Opera<br>
      Internet Explorerは非対応です。
    </div>
  </div>

  <div class="faq">
    <div class="question">Q. 表示がおかしい</div>
    <div class="answer">
      A. お手数ですがパソコンから開いてみてください。<br>
      PC環境の開発を優先しています。
    </div>
  </div>
</div>

</body>
</html>
